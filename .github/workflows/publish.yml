name: Publish catalog
# Signs catalog/catalog.json and serves it on GitHub Pages. Runs when you merge a reviewed update,
# after the daily job's automatic updates, or by hand.
on:
  push:
    branches: [main]
    paths: ["catalog/catalog.json"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_try.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run sign
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      # GitHub sometimes can't see a just-uploaded Pages artifact for a few seconds
      # ("No artifacts named github-pages were found"). Wait and try again before failing the run.
      - id: deploy_try
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy_try.outcome == 'failure'
        run: sleep 45
      - id: deploy
        if: steps.deploy_try.outcome == 'failure'
        uses: actions/deploy-pages@v4
