name: Daily update
# 06:00 IST every day. Safe changes publish automatically; card-term changes open a pull request.
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.push.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/cache@v4
        with:
          path: .cache
          key: pages-${{ github.run_id }}
          restore-keys: pages-
      - run: npm run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USE_BROWSER: "1"
      - id: s
        run: |
          echo "changed=$(jq -r .changed out/summary.json)" >> "$GITHUB_OUTPUT"
          echo "risky=$(jq -r .risky out/summary.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version out/summary.json)" >> "$GITHUB_OUTPUT"
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish safe changes directly
        id: push
        if: steps.s.outputs.changed == 'true' && steps.s.outputs.risky == '0'
        run: |
          git config user.name "cardwise-bot"
          git config user.email "cardwise-bot@users.noreply.github.com"
          git add catalog/catalog.json
          git commit -F out/report.md
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Open a pull request for card-term changes
        if: steps.s.outputs.changed == 'true' && steps.s.outputs.risky != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data-update-${{ steps.s.outputs.version }}
          title: "Review: card terms changed (${{ steps.s.outputs.version }})"
          body-path: out/report.md
          add-paths: catalog/catalog.json
          commit-message: "Data update ${{ steps.s.outputs.version }}"
          labels: needs-review

  publish:
    needs: update
    if: needs.update.outputs.published == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    secrets: inherit
